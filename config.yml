# Paths default to the synthetic example data; point at data/raw/ for the real study.
paths:
  metadata_xlsx: "data/example/MetaData_example.xlsx"
  metadata_sheet: "Metadata"
  raw_counts_csv: "data/example/RawCounts_example.csv"
  negative_probe: "NegProbe-WTX"
  results_dir: "results"

# Exploratory thresholds: nothing is expected to pass FDR with 2 vs 2 animals.
# GeoMx QC (GeomxTools-style). LOQ per ROI = max(min_loq, NegProbe-WTX count).
geomx:
  min_loq: 2
  roi_min_gene_detection: 0.10   # drop ROIs detecting < 10% of genes above LOQ
  gene_detection_rate: 0.10      # keep genes above LOQ in >= 10% of an ROI type's ROIs

thresholds:
  min_rowmean: 0          # optional extra mean-count filter (0 = off); see R/06_filter_sensitivity.R
  fdr: 0.05
  fdr_original: 0.01      # cutoff used in the original ROI-as-sample analysis, for comparison
  nominal_p: 0.05
  abs_log2fc: 0.32
  top_genes_heatmap: 30

rois:
  plaqueCortex:    {tissue: brain, region: cortex,      pathology: plaque-bearing, label: "Plaque-bearing Cortex"}
  nonplaqueCortex: {tissue: brain, region: cortex,      pathology: plaque-free,    label: "Plaque-free Cortex"}
  plaqueHippo:     {tissue: brain, region: hippocampus, pathology: plaque-bearing, label: "Plaque-bearing Hippocampus"}
  nonplaqueHippo:  {tissue: brain, region: hippocampus, pathology: plaque-free,    label: "Plaque-free Hippocampus"}
  periportal:      {tissue: liver, region: periportal,  pathology: ~,              label: "Periportal Liver"}
  perivenous:      {tissue: liver, region: perivenous,  pathology: ~,              label: "Perivenous Liver"}
